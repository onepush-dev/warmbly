name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'tracking/**', 'realtime/**', 'web/**', 'admin/**', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
env:
  WARMBLY_TAG: v0.6.72
  VERSION: 0.6.72
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc: [core, tracking, realtime, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc }}
          build-args: WARMBLY_TAG=${{ env.WARMBLY_TAG }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/warmbly-${{ matrix.svc }}:${{ env.VERSION }}
